name: Deploy Spring Boot to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: springboot-ecs-repo


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::937749309122:role/github-actions-ecs-role
        aws-region: ${{ env.AWS_REGION }}


    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build Docker image
      run: |
        docker build \
        -t $ECR_REPOSITORY .


    - name: Tag Docker image
      run: |
        docker tag \
        $ECR_REPOSITORY:latest \
        <ACCOUNT_ID>.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:latest


    - name: Push image to ECR
      run: |
        docker push \
        <ACCOUNT_ID>.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:latest


    - name: Deploy ECS service
      run: |

        aws ecs update-service \
        --cluster springboot-ecs-cluster \
        --service springboot-ecs-service \
        --force-new-deployment \
        --region $AWS_REGION
